name: iOS build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project WashHead.xcodeproj \
            -scheme WashHead \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/WashHeadDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Render current SwiftUI screen on macOS
        run: |
          mkdir -p screenshots
          xcrun swiftc \
            -parse-as-library \
            WashHead/CharacterHeadView.swift \
            Tools/SnapshotRenderer/Renderer.swift \
            -o "$RUNNER_TEMP/washhead-snapshot" \
            -framework SwiftUI \
            -framework AppKit
          SNAPSHOT_OUTPUT="$PWD/screenshots/main.png" "$RUNNER_TEMP/washhead-snapshot"

      - name: Upload SwiftUI screenshot
        uses: actions/upload-artifact@v4
        with:
          name: washhead-swiftui-screenshot
          path: screenshots/main.png

      - name: Publish current screenshot in repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p docs/screenshots
          cp screenshots/main.png docs/screenshots/main.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/main.png
          if ! git diff --cached --quiet; then
            git commit -m "Update cloud SwiftUI screenshot [skip ci]"
            git push
          fi
